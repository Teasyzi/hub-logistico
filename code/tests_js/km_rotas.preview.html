<!doctype html>
<meta charset="utf-8">
<title>Prévia revisão de rotas KM</title>
<!-- Prévia local da tela #/km/rotas, sem Firebase. Os arquivos vêm de /amostras/:
     ?mes=AAAA-MM&u=NORTE&arq=<relatório de rotas ou planilha KM antiga>&tabelas=<planilha KM antiga, para a ida e volta>
     Simula uma rota com ida e volta zerada e uma excluída. Os dados ficam só neste navegador. -->
<link rel="stylesheet" href="../../docs/css/hub.css">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<main id="app"><p>carregando…</p></main>
<script type="module">
const I = await import('../../docs/js/importar.js');
const K = await import('../../docs/js/km.js');
const V = await import('../../docs/js/views.js');
const q = new URLSearchParams(location.search), mes = q.get('mes'), u = q.get('u') || 'NORTE';
const baixar = async (n) => new File([await (await fetch('/amostras/' + encodeURIComponent(n))).arrayBuffer()], n);
const x = await I.lerArquivo(await baixar(q.get('arq')), { mes, unidade: 'AUTO', contexto: 'km' });
const t = q.get('tabelas') ? (await I.lerArquivo(await baixar(q.get('tabelas')), { mes, contexto: 'km' })).tabelas : {};
const brutas = x.rotas.filter((r) => r.unidade === u && r.data.startsWith(mes)).sort((a, b) => a.data.localeCompare(b.data));
const base = K.aplicarAjustesKM(brutas);
const ajustes = { [u]: [base[0] && { chave: base[0].chave, idaVolta: 0 }, base[1] && { chave: base[1].chave, excluir: true }].filter(Boolean) };
const rotas = K.aplicarAjustesKM(brutas, ajustes);
document.getElementById('app').innerHTML = V.paginaKMRotas(u, { rotas, secoes: null, parametros: t[u] || {} }, { mes, topo: `<h1>KM planejado × realizado — Revisar rotas (prévia)</h1>${V.abasKM('rotas', mes, true)}` });
document.getElementById('filtroRotas').onchange = (e) => {
  for (const tr of document.querySelectorAll('tr[data-chave]')) tr.hidden = e.target.value !== 'todas' && !tr.dataset.grupos.split(' ').includes(e.target.value);
};
window.pronto = true;
</script>
