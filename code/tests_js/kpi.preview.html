<!doctype html>
<meta charset="utf-8">
<title>Prévia KPI</title>
<!-- Prévia local do KPI, sem Firebase. Os arquivos vêm de /amostras/ e são importados na ordem:
     ?mes=AAAA-MM&arquivos=<arq1>|<arq2>|…[&pagina=painel|importar][&admin=0][&editar=1][&dump=1][&conferir=<KPI oficial>]
     Aceita o KPI do mês e a planilha de metas de perdas (como o ⚙ Importar). O mês anterior também é montado (metas herdadas).
     &conferir= compara cada célula do catálogo (contas incluídas) com os valores da planilha oficial.
     &dump=1 põe a planilha exportada em base64 num <pre id="b64">. -->
<link rel="stylesheet" href="../../docs/css/hub.css?v=20261126-05">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<main id="app"><p>carregando…</p></main>
<script type="module">
const R = await import('../../docs/js/kpi.js?v=20261126-05');
const T = await import('../../docs/js/kpi_telas.js?v=20261126-05');
const X = await import('../../docs/js/exportar_kpi.js?v=20261126-05');
const q = new URLSearchParams(location.search), mes = q.get('mes') || '2026-11', pagina = q.get('pagina') || 'painel', admin = q.get('admin') !== '0';
const ler = async (n) => XLSX.read(await (await fetch('/amostras/' + encodeURIComponent(n))).arrayBuffer(), { type: 'array', cellDates: false });
const docs = {}, lidos = [];
for (const n of (q.get('arquivos') || '').split('|').filter(Boolean)) {
  const x = R.lerArquivoKPI(await ler(n), n, +mes.slice(0, 4)), res = {};
  for (const [m, es] of Object.entries(x.meses)) { const r = R.aplicarKPI(docs[m], es); docs[m] = { valores: r.valores, origem: r.origem }; res[m] = { n: r.n, mantidos: r.mantidos }; }
  lidos.push({ arquivo: n, tipo: x.tipo, res });
}
const ant = (m) => { const [a, b] = m.split('-').map(Number); return b === 1 ? `${a - 1}-12` : `${a}-${String(b - 1).padStart(2, '0')}`; };
const efetivo = () => R.efetivoKPI(docs[mes], R.efetivoKPI(docs[ant(mes)]));
const topo = (aba, t) => `<h1>KPI Distribuição e Logística — ${t} (prévia)</h1>${T.abasKPI(aba, mes, admin)}`;
const render = () => {
  const x = efetivo();
  const h = pagina === 'importar' ? `${topo('importar', 'Importar arquivos')}${T.explicaImportarKPI}<pre class="small">${JSON.stringify(lidos, null, 1)}</pre>`
    : T.paginaKPI(x, { mes, admin, topo: topo('painel', `LOGÍSTICA E DISTRIBUIÇÃO - GRUPO CB · ${mes}`) });
  document.getElementById('app').innerHTML = (window.avisoConferencia || '') + h;
  if (admin) T.ligarEdicaoKPI(document, x, async (ed) => { docs[mes] = R.editarKPI(docs[mes], ed); }, render);
  document.getElementById('exportarKPI')?.addEventListener('click', () => X.baixarKPI(mes, efetivo().valores));
  if (q.get('editar')) document.getElementById('editarKPI')?.click();
};
if (q.get('conferir')) {
  const ws = (await ler(q.get('conferir'))).Sheets['LOGÍSTICA E DISTRIBUIÇÃO'], cc = R.calcularKPI(efetivo().valores), dif = [];
  let ok = 0;
  for (const c of Object.values(R.CELULAS_KPI)) {
    if (c.oculta) continue;
    const p = ws[c.r]?.v, pv = typeof p === 'number' ? p : null, h = cc[c.r];
    const igual = pv == null ? h == null : h != null && Math.abs(pv - h) <= 1e-9 * Math.max(1, Math.abs(pv));
    if (igual) ok++; else dif.push({ cel: c.r, planilha: p, hub: h });
  }
  window.conferencia = { ok, dif };
  window.avisoConferencia = `<div class="${dif.length ? 'aviso' : 'okmsg'}">Conferência com ${q.get('conferir')}: ${ok} células iguais, ${dif.length} diferentes${dif.length ? ': ' + dif.map((d) => `${d.cel} planilha ${d.planilha} × Hub ${d.hub}`).join('; ') : ''}</div>`;
}
render();
if (q.get('dump')) {
  const bytes = await X.gerarKPI(mes, efetivo().valores);
  let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  const pre = document.createElement('pre'); pre.id = 'b64'; pre.textContent = btoa(s); document.body.append(pre);
}
window.docs = docs; window.lidos = lidos; window.pronto = true;
</script>
